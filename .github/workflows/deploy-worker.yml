name: Deploy Divine Guide worker
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
      WORKER_NAME: divine-guide
      SUBDOMAIN: ${{ vars.CF_WORKERS_SUBDOMAIN }}
    steps:
    - uses: actions/checkout@v4

    - name: Ensure KV namespace exists
      run: |
        cd worker
        npx -y wrangler@latest kv namespace list > kv.json || echo "[]" > kv.json
        ID=$(python3 -c "import json;ns=json.load(open('kv.json'));print(next((n['id'] for n in ns if 'KHAU_PUSH' in n.get('title','')),''))")
        if [ -z "$ID" ]; then
          npx -y wrangler@latest kv namespace create KHAU_PUSH > kvcreate.txt
          ID=$(grep -oE '[a-f0-9]{32}' kvcreate.txt | head -1)
        fi
        echo "KV namespace id: $ID"
        sed -i "s/\\$KV_ID/$ID/" wrangler.toml

    - name: Deploy worker via wrangler
      run: |
        cd worker && npx -y wrangler@latest deploy

    - name: Set VAPID key as worker secret
      run: |
        printf '%s' "$VAPID_JWK" | npx -y wrangler@latest secret put VAPID_JWK --name "$WORKER_NAME"
      env:
        VAPID_JWK: ${{ secrets.VAPID_JWK }}

    - name: Set Gemini key as worker secret
      run: |
        printf '%s' "$GEMINI_API_KEY" | npx -y wrangler@latest secret put GEMINI_API_KEY --name "$WORKER_NAME"
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    - name: Smoke test push routes
      run: |
        sleep 3
        curl -s -w '\npush-data (expect 401): %{http_code}\n' -o /dev/null \
          "https://$WORKER_NAME.$SUBDOMAIN.workers.dev/push-data"

    - name: Smoke test (CORS + endpoint shape)
      run: |
        sleep 5
        curl -s -o /dev/null -w 'OPTIONS preflight: %{http_code}\n' -X OPTIONS \
          "https://$WORKER_NAME.$SUBDOMAIN.workers.dev/chat" \
          -H "Origin: https://ankitsamriwal.github.io" -H "Access-Control-Request-Method: POST" \
          -H "Access-Control-Request-Headers: content-type"
