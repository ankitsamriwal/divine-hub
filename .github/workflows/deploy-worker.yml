name: Deploy Divine Guide worker
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
      WORKER_NAME: divine-guide
      SUBDOMAIN: ${{ vars.CF_WORKERS_SUBDOMAIN }}
    steps:
    - uses: actions/checkout@v4

    - name: Deploy worker via wrangler
      run: |
        cd worker && npx -y wrangler@latest deploy

    - name: Set VAPID key as worker secret
      run: |
        printf '%s' "$VAPID_JWK" | npx -y wrangler@latest secret put VAPID_JWK --name "$WORKER_NAME"
      env:
        VAPID_JWK: ${{ secrets.VAPID_JWK }}

    - name: Set Gemini key as worker secret
      run: |
        printf '%s' "$GEMINI_API_KEY" | npx -y wrangler@latest secret put GEMINI_API_KEY --name "$WORKER_NAME"
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    - name: Set Sankalp+ secrets (skipped when a secret is not configured)
      run: |
        for NAME in PLUS_TOKEN_SECRET PLUS_ADMIN_KEY STRIPE_WEBHOOK_SECRET RAZORPAY_WEBHOOK_SECRET; do
          VAL="${!NAME}"
          if [ -n "$VAL" ]; then printf '%s' "$VAL" | npx -y wrangler@latest secret put "$NAME" --name "$WORKER_NAME"; else echo "skip $NAME (not set)"; fi
        done
      env:
        PLUS_TOKEN_SECRET: ${{ secrets.PLUS_TOKEN_SECRET }}
        PLUS_ADMIN_KEY: ${{ secrets.PLUS_ADMIN_KEY }}
        STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}

    - name: Smoke test push routes
      run: |
        sleep 3
        curl -s -w '\npush-data (expect 401): %{http_code}\n' -o /dev/null \
          "https://$WORKER_NAME.$SUBDOMAIN.workers.dev/push-data"

    - name: Smoke test (CORS + endpoint shape)
      run: |
        sleep 5
        curl -s -o /dev/null -w 'OPTIONS preflight: %{http_code}\n' -X OPTIONS \
          "https://$WORKER_NAME.$SUBDOMAIN.workers.dev/chat" \
          -H "Origin: https://ankitsamriwal.github.io" -H "Access-Control-Request-Method: POST" \
          -H "Access-Control-Request-Headers: content-type"
        curl -s -w '\nplus webhook while payments are off (expect 404): %{http_code}\n' -o /dev/null -X POST \
          "https://$WORKER_NAME.$SUBDOMAIN.workers.dev/plus/webhook/stripe" -d '{}'
        curl -s -w '\nplus admin stats without key (expect 401, or 503 if PLUS_TOKEN_SECRET unset): %{http_code}\n' -o /dev/null \
          "https://$WORKER_NAME.$SUBDOMAIN.workers.dev/plus/admin/stats"
